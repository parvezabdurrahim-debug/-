<!DOCTYPE html>
<html lang="bn">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Eid Festival Ultra</title>

<style>

body,html{
margin:0;
padding:0;
height:100%;
overflow:hidden;
font-family:sans-serif;
color:white;
display:flex;
justify-content:center;
align-items:center;
background:url("https://i.ibb.co/2kR0pGJ/mosque.png") center/cover no-repeat;
}

/* dark overlay */

body::before{
content:"";
position:fixed;
inset:0;
background:rgba(0,0,0,.6);
}

/* card */

.card{
position:relative;
z-index:10;
background:rgba(0,0,0,.5);
padding:25px;
border-radius:20px;
text-align:center;
box-shadow:0 0 20px gold;
}

/* typing */

.typing{
font-size:32px;
font-weight:bold;
background:linear-gradient(red,yellow,green,cyan,blue);
-webkit-background-clip:text;
color:transparent;
}

/* text */

.text{
font-size:14px;
margin-top:10px;
}

/* name */

.name{
font-size:11px;
color:gold;
margin:5px;
}

/* button */

.btn{
background:gold;
border:none;
padding:10px 20px;
border-radius:20px;
cursor:pointer;
}

/* light */

canvas{
position:fixed;
top:0;
left:0;
}

</style>

</head>

<body>


<div class="card">

<div class="typing">
ঈদ মোবারক
</div>

<div class="text">

ঈদ মোবারক 🌙  
আপনার জীবন সুখে ভরে উঠুক  
শান্তি ও আনন্দ নেমে আসুক  
সবার ঈদ হোক সুন্দর  

</div>

<div class="name">
— আব্দুর রহিম —
</div>

<button class="btn" onclick="startShow()">
উৎসব শুরু করুন 🎶
</button>

</div>


<audio id="song"
src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3">
</audio>


<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/fireworks-js@2/dist/index.umd.js"></script>


<script>

const song=document.getElementById("song")

const fireworks = new Fireworks.default(document.body,{

rocketsPoint:{min:0,max:100},

hue:{min:0,max:360},

delay:{min:5,max:10},

speed:4,

acceleration:1.08,

friction:0.95,

gravity:1.2,

particles:150,

trace:6,

explosion:10,

intensity:40,

brightness:{min:50,max:100},

decay:{min:0.01,max:0.02}

})

let started=false


function megaBlast(){

for(let i=0;i<15;i++){

setTimeout(()=>{

confetti({

particleCount:120,

spread:140,

origin:{y:.6}

})

},i*150)

}

}


function startShow(){

if(!started){

song.play()

megaBlast()

fireworks.start()

started=true

}

}


/* spark rain */

setInterval(()=>{

confetti({

particleCount:20,

spread:360,

startVelocity:10,

origin:{
x:Math.random(),
y:0
}

})

},400)



/* shake blast */

let lastX,lastY,lastZ

window.addEventListener("devicemotion",e=>{

let x=e.accelerationIncludingGravity.x
let y=e.accelerationIncludingGravity.y
let z=e.accelerationIncludingGravity.z

if(lastX){

let diff=Math.abs(x+y+z-lastX-lastY-lastZ)

if(diff>25){

megaBlast()

}

}

lastX=x
lastY=y
lastZ=z

})

</script>

</body>
</html>
