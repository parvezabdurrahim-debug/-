<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Eid Firework Pro Max</title>

<style>

body,html{
margin:0;
padding:0;
height:100%;
background:black;
color:white;
display:flex;
justify-content:center;
align-items:center;
font-family:sans-serif;
overflow:hidden;
}

/* card */

.card{
position:relative;
z-index:10;
background:rgba(0,0,0,.5);
padding:25px;
border-radius:20px;
text-align:center;
box-shadow:0 0 20px gold;
}

.typing{
font-size:28px;
font-weight:bold;
}

.text{
font-size:14px;
margin-top:10px;
}

.name{
font-size:12px;
margin:8px;
color:gold;
}

.btn{
background:gold;
border:none;
padding:10px 20px;
border-radius:20px;
cursor:pointer;
}

canvas{
position:fixed;
top:0;
left:0;
}

</style>
</head>

<body>

<div class="card">

<div class="typing">
ঈদ মোবারক
</div>

<div class="text">
ঈদ মোবারক! 🌙  
আপনার ঈদ হোক আনন্দময়  
শান্তি ও সুখে ভরে উঠুক জীবন  
</div>

<div class="name">
— আব্দুর রাহিম —
</div>

<button class="btn" onclick="startShow()">
উৎসব শুরু করুন 🎶
</button>

</div>


<audio id="song"
src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3">
</audio>


<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/fireworks-js@2/dist/index.umd.js"></script>


<script>

const song=document.getElementById("song")

const fireworks = new Fireworks.default(document.body, {
  rocketsPoint:{min:0,max:100},
  speed:2,
  acceleration:1.05,
  friction:0.97,
  gravity:1.5,
  particles:80,
  explosion:5
});

let started=false

function blast(){

for(let i=0;i<5;i++){

setTimeout(()=>{

confetti({
particleCount:80,
spread:100,
origin:{y:.6}
})

},i*300)

}

}

function startShow(){

if(!started){

song.play()

blast()

fireworks.start()

started=true

}

}


/* shake blast */

let lastX,lastY,lastZ

window.addEventListener("devicemotion",e=>{

let x=e.accelerationIncludingGravity.x
let y=e.accelerationIncludingGravity.y
let z=e.accelerationIncludingGravity.z

if(lastX){

let diff=Math.abs(x+y+z-lastX-lastY-lastZ)

if(diff>25){

blast()

}

}

lastX=x
lastY=y
lastZ=z

})

</script>

</body>
</html>
